name: financial_leak_env
version: "1.0.0"
description: >
  An OpenEnv environment that simulates real-world personal finance decisions.
  An LLM agent analyses transactions to detect hidden money leaks (unused
  subscriptions, duplicate charges, micro-spending), understands behavioural
  trends (night/weekend overspending), and optimises toward explicit savings
  goals. Supports multi-step interaction with dense per-step rewards.

entry_point: api.app:app

endpoints:
  reset: POST /reset
  step:  POST /step
  state: GET  /state

observation_type: env.models.Observation
action_type:      env.models.Action

max_steps: 5
reward_range: [0.0, 1.0]

tasks:
  - id: leak_detection_easy
    difficulty: easy
    description: "Cancel unused subscriptions to stop money leaks."

  - id: duplicate_charge_easy
    difficulty: easy
    description: "Detect and flag duplicate or near-duplicate charges."

  - id: micro_spending_easy
    difficulty: easy
    description: "Identify micro-transaction drain across many small purchases."

  - id: behavior_analysis_medium
    difficulty: medium
    description: "Analyse spending by time-of-day to surface behavioural insights."

  - id: weekend_spending_medium
    difficulty: medium
    description: "Detect weekend overspending spikes vs weekday baseline."

  - id: subscription_overlap_medium
    difficulty: medium
    description: "Find overlapping subscriptions providing the same service."

  - id: goal_optimization_hard
    difficulty: hard
    description: "Allocate budget reductions to hit a £500 monthly savings target."

  - id: tight_budget_hard
    difficulty: hard
    description: "Save £200 without violating constraints (health, rent)."

  - id: multi_goal_hard
    difficulty: hard
    description: "Optimise for emergency fund, debt reduction, and carbon reduction simultaneously."

grader_module: env.graders
score_range: [0.0, 1.0]

runtime: python
entrypoint: "uvicorn api.app:app --host 0.0.0.0 --port 7860"